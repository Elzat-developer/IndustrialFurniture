name: Deploy Application to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy Backend to Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "src/**,build.gradle,settings.gradle,Dockerfile,gradlew,gradlew.bat,gradle/**"
          target: "/opt/richart/backend"
          overwrite: true

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "=== 1. Checking CreateProductDto on server ==="
            cat /opt/richart/backend/src/main/java/i/f/industrialfurniture/dto/user/CreateProductDto.java
            
            echo "=== 2. Cleaning old build cache on host ==="
            rm -rf /opt/richart/backend/build /opt/richart/backend/.gradle
            
            echo "=== 3. Rebuilding backend with no cache ==="
            cd /opt/richart
            docker compose build --no-cache backend
            docker compose up -d --force-recreate backend
            
            echo "=== 4. Checking running containers ==="
            docker ps --filter "name=richart-backend"
            echo "Deployment successful! 🚀"