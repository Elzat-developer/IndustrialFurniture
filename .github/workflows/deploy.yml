name: Deploy Spring Boot Application

on:
  push:
    branches:
      - main # Запускается автоматически при пуше в main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Подготовка Java и сборка проекта
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      # 2. Настройка SSH доступа к серверу
      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      # 3. Деплой на сервер и перезапуск службы
      - name: Deploy to Server and Restart Service
        env:
          HOST: ${{ secrets.SERVER_IP }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT }}
        run: |
          # 3.1. Добавляем сервер в доверенные (чтобы не было вопроса yes/no)
          ssh-keyscan -p $PORT $HOST >> ~/.ssh/known_hosts
          
          # 3.2. Создаем папку на сервере, если ее нет
          ssh -p $PORT $USER@$HOST "mkdir -p /opt/industrial-furniture"
          
          # 3.3. Копируем собранный JAR-файл на сервер
          rsync -avz -e "ssh -p $PORT" ./build/libs/IndustrialFurniture-0.0.1-SNAPSHOT.jar $USER@$HOST:/opt/industrial-furniture/
          
          # 3.4. Перезапускаем Spring Boot через systemctl
          ssh -p $PORT $USER@$HOST "
            echo 'Restarting Spring Boot service...'
            sudo systemctl restart industrial-furniture
            echo 'Deployment successful! 🚀'
          "