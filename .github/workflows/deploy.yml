name: Deploy Spring Boot Application

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Deploy to Server and Restart Service
        env:
          HOST: ${{ secrets.SERVER_IP }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT }}
        run: |
          # 3.1. Подготовка локального окружения в GitHub
          mkdir -p ~/.ssh
          touch ~/.ssh/known_hosts
          ssh-keyscan -p $PORT -H $HOST >> ~/.ssh/known_hosts
          
          # 3.2. Создаем папку (добавлен флаг игнорирования проверки ключа)
          ssh -o StrictHostKeyChecking=no -p $PORT $USER@$HOST "mkdir -p /opt/industrial-furniture"
          
          # 3.3. Копируем JAR (добавлен флаг игнорирования проверки ключа)
          rsync -avz -e "ssh -p $PORT -o StrictHostKeyChecking=no" ./build/libs/IndustrialFurniture-0.0.1-SNAPSHOT.jar $USER@$HOST:/opt/industrial-furniture/
          
          # 3.4. Перезапуск сервиса
          ssh -o StrictHostKeyChecking=no -p $PORT $USER@$HOST "
            echo 'Restarting Spring Boot service...'
            sudo systemctl restart industrial-furniture
            echo 'Deployment successful! 🚀'
          "